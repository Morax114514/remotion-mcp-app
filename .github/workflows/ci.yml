name: Remotion Ultimate CI

on:
  push:
    branches: [main, ultimate-v0.1.0]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check:syntax
      - name: Typecheck
        run: npm run typecheck
      - name: MCP App build
        run: npm run build
